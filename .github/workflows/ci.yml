name: QuickCalc CI

# This repository is a monorepo of unrelated lab submissions. This workflow is
# scoped with `paths` and a working-directory default so it only builds/tests
# QuickCalc (Agile_Devops/Quickcalc) and doesn't run for unrelated lab changes.
on:
  push:
    branches: [main]
    paths:
      - "Agile_Devops/Quickcalc/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Agile_Devops/Quickcalc/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: Agile_Devops/Quickcalc

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: Agile_Devops/Quickcalc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Smoke-check health endpoint
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl --fail http://localhost:3000/health
          kill $SERVER_PID
